# ==============================================================================
# PitchSense model provider configuration
# Hosted chat completion provider: Azure OpenAI-compatible endpoint
# Offline Fallback: Deterministic Rule-Engine for Zero-Key Local Replay
# ==============================================================================

narration_prod:
  provider: "foundry"
  model: "gpt-4.1-mini"
  temperature: 0.2
  max_tokens: 250

narration_fast:
  provider: "foundry"
  model: "gpt-4.1-mini"
  temperature: 0.2
  max_tokens: 250

narration_dev:
  provider: "foundry"
  model: "gpt-4.1-mini"
  temperature: 0.2
  max_tokens: 250

recap_deep:
  provider: "foundry"
  model: "gpt-4.1-mini"
  temperature: 0.3
  max_tokens: 500

vision_scout:
  provider: "foundry"
  model: "gpt-4.1-mini"
  temperature: 0.1
  max_tokens: 350

lens_localize:
  provider: "foundry"
  model: "gpt-4.1-mini"
  temperature: 0.2
  max_tokens: 250

guard_input:
  provider: "foundry"
  model: "gpt-4.1-mini"
  temperature: 0.0
  max_tokens: 100

# Strict Azure Failover Sequence
failover_chain:
  - "foundry"
  - "offline"
