[project]
name = "pitchsense"
version = "0.1.0"
description = "PitchSense: The Match Intelligence Studio — machines see, agents narrate, directors decide"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "pyyaml>=6.0.1",
    "openai>=1.40.0",
    "python-dotenv>=1.0.1",
    "jsonschema>=4.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
